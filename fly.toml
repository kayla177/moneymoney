# Fly.io config for MoneyMoney.
# Deploy:  fly launch --no-deploy   (first time, to create the app + volume)
#          fly secrets set GMAIL_ADDRESS=... GMAIL_APP_PASSWORD="..."
#          fly deploy
app = "moneymoney"
primary_region = "yyz"  # Toronto — close to home

[build]

[env]
  DATABASE_URL = "sqlite:////data/moneymoney.db"
  POLL_INTERVAL_SECONDS = "60"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always running so the email poller keeps working — do NOT let Fly
  # stop the machine on idle, or polling stops.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Persistent disk for the SQLite database. Create with:
#   fly volumes create moneymoney_data --size 1 --region yyz
[mounts]
  source = "moneymoney_data"
  destination = "/data"
